name: Обновить трекер задач в README

on:
  issues:
    types: [opened, edited, closed, reopened, deleted, transferred]
  schedule:
    - cron: "5 21 * * *"   # каждый день в 00:05 по Москве, чтобы обновлять «просрочено»/«сегодня»
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: tasks-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Пересобрать README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TASKS_TZ: Europe/Moscow
        run: python scripts/update_tasks.py
      - name: Закоммитить изменения
        run: |
          if git diff --quiet README.md; then echo "Без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Обновить трекер задач"
          git pull --rebase
          git push
