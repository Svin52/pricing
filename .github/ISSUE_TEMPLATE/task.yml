name: Задача
description: Новая задача с дедлайном. Попадёт в трекер в README.
body:
  - type: input
    id: deadline
    attributes:
      label: Дедлайн
      description: "Дата в формате ГГГГ-ММ-ДД или ДД.ММ.ГГГГ, можно добавить время, например 2026-11-20 18:00. Оставьте пустым, если дедлайна нет."
      placeholder: "2026-11-20"
    validations:
      required: false
  - type: input
    id: assignee
    attributes:
      label: Исполнитель
      description: "Кто делает задачу. Можно вместо этого выбрать человека справа в Assignees: тогда в трекере будет он."
      placeholder: "Илья"
    validations:
      required: false
  - type: input
    id: assigned_by
    attributes:
      label: Назначил
      description: "Кто поставил задачу. Если оставить пустым, будет автор задачи."
    validations:
      required: false
  - type: textarea
    id: details
    attributes:
      label: Комментарий
      description: Необязательно.
    validations:
      required: false
